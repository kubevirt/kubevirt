# https://github.com/fossas/fossa-cli/blob/v3.6.11/docs/references/files/fossa-yml.md

version: 3

project:
  id: git@github.com:kubevirt/kubevirt.git
  url: github.com/kubevirt/kubevirt
  team: Kubevirt

targets:
  only:
  - type: gomod
    path: ./

paths:
  exclude:
    - .bazeldnf
    - bazel-bin
    - bazel-out
    - kubevirtci

# https://github.com/fossas/fossa-cli/blob/v3.20.13/docs/features/first-party-license-scans.md#path-filtering-first-party-license-scans
vendoredDependencies:
  licenseScanPathFilters:
    exclude:
      - ".bazeldnf/*"
      - ".bazeldnf/**"
      - "bazel-bin/*"
      - "bazel-bin/**"
      - "bazel-out/*"
      - "bazel-out/**"
      - "bazel-genfiles/*"
      - "bazel-genfiles/**"
      - "bazel-testlogs/*"
      - "bazel-testlogs/**"
      - "bazel-kubevirt/*"
      - "bazel-kubevirt/**"
      - "kubevirtci/*"
      - "kubevirtci/**"
