language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: false
  path_filters:
    - "!vendor/**"
  path_instructions:
    - path: "{pkg,cmd,staging,tests}/**/*.go"
      instructions: >
        See docs/coding-conventions.md, docs/reviewer-guide.md, docs/architecture.md,
        docs/gosec.md, and docs/deprecation.md.
    - path: "tests/**"
      instructions: >
        See tests/README.md, docs/conformance.md, docs/quarantine.md, and
        docs/tests/functional-test-guidelines.md.
    - path: "pkg/libvmi/**"
      instructions: "Follow the rules in pkg/libvmi/README.md."
    - path: "tests/libvmifact/**"
      instructions: "Follow the rules in tests/libvmifact/README.md."
    - path: "pkg/network/**"
      instructions: "See docs/network/network-binding-mechanisms.md."
    - path: "pkg/virt-launcher/virtwrap/converter/**"
      instructions: "Follow the rules in pkg/virt-launcher/virtwrap/converter/README.md."
    - path: "pkg/monitoring/**"
      instructions: "See docs/observability/monitoring-guidelines.md."
    - path: "{staging/src/kubevirt.io/api,pkg/virt-api/webhooks}/**"
      instructions: "Follow the rules in docs/api/design_guidelines.md."
    - path: "**/*"
      instructions: |
        For every PR review, read the full subject and body of every
        commit currently in the PR, including during incremental reviews.
        Use commit messages to understand rationale, scope, and intentional
        behavior before raising findings.
        Check the messages against docs/commit-message-guidelines.md.
        Verify implementation claims against the code and relevant evidence.
        Report the inspected commit SHAs in the review walkthrough.
        If commit messages cannot be retrieved, state that limitation.

        Also read the current PR title and full description, including
        during incremental reviews. Check them against
        docs/pr-description-guidelines.md. Report material contradictions
        between the description and the diff, commit messages, or tests.
        State in the review walkthrough that the PR title and description
        were inspected. If either cannot be retrieved, state that limitation.
  tools:
    trufflehog:
      enabled: true

knowledge_base:
  opt_out: true
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - docs/commit-message-guidelines.md
      - docs/pr-description-guidelines.md
  linked_repositories:
    - repository: "kubevirt/enhancements"
      instructions: >
        Contains VEP design documents and feature gate lifecycle rules
        (docs/feature-lifecycle.md). When a PR references a VEP number, locate
        the corresponding vep.md and verify the implementation aligns with the stated
        API shape, phasing plan, and non-goals. For changes touching feature gates,
        apply the lifecycle rules from docs/feature-lifecycle.md.
